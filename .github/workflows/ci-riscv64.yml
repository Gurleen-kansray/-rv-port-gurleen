name: HPC Package Audit — riscv64

on: [push, pull_request]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dpkg tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq dpkg-dev binutils file

      - name: Run audit on all debs
        run: |
          python3 automation/audit_engine_v2.py --all --debs-dir debs

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit_report_v2.json
